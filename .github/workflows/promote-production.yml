name: Promote verified release to production
on:
  workflow_dispatch:
    inputs:
      release:
        description: Verified Cloud Deploy release name from layer 7 evidence
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: gke-lab-production
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-toolchain
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_APPLY_SERVICE_ACCOUNT }}
      - name: Promote and approve production rollout
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          mkdir -p test-results/live
          gcloud deploy releases promote \
            --project="$PROJECT_ID" --region="$REGION" \
            --delivery-pipeline=gke-lab --release="$RELEASE" \
            --to-target=gke-lab-production --quiet
          rollout=$(gcloud deploy rollouts list \
            --project="$PROJECT_ID" --region="$REGION" \
            --delivery-pipeline=gke-lab --release="$RELEASE" \
            --filter='targetId=gke-lab-production' --format='value(name)' --limit=1)
          test -n "$rollout"
          gcloud deploy rollouts approve "$rollout" \
            --project="$PROJECT_ID" --region="$REGION" \
            --delivery-pipeline=gke-lab --release="$RELEASE" --quiet
          deadline=$((SECONDS+1800))
          while (( SECONDS < deadline )); do
            state=$(gcloud deploy rollouts describe "$rollout" \
              --project="$PROJECT_ID" --region="$REGION" \
              --delivery-pipeline=gke-lab --release="$RELEASE" \
              --format='value(state)')
            case "$state" in
              SUCCEEDED) break ;;
              FAILED|HALTED|CANCELLED) exit 1 ;;
            esac
            sleep 15
          done
          test "${state:-}" = SUCCEEDED
          gcloud deploy rollouts describe "$rollout" \
            --project="$PROJECT_ID" --region="$REGION" \
            --delivery-pipeline=gke-lab --release="$RELEASE" \
            --format=json >test-results/live/production-rollout.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: production-${{ inputs.release }}-${{ github.sha }}
          path: test-results/live/
          retention-days: 30
          if-no-files-found: error
