name: Live integration layer
on:
  workflow_call:
    inputs:
      layer: { type: number, required: true }
      profile: { type: string, required: true }
      operation: { type: string, required: true }
      approval_environment: { type: string, required: true }
permissions:
  contents: read
  id-token: write
concurrency:
  group: gke-lab-live
  cancel-in-progress: false
jobs:
  live-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ inputs.approval_environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          # Layer 1 replaces this transitional identity with phase-specific
          # plan/apply identities and prefix-scoped plan storage permissions.
          service_account: ${{ vars.TERRAFORM_APPLY_SERVICE_ACCOUNT }}
      - name: Run one explicit layer operation
        env:
          PROFILE: ${{ inputs.profile }}
          PLAN_STORE_URI: gs://${{ vars.TF_STATE_BUCKET }}/reviewed-plans
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_project_number: ${{ vars.GCP_PROJECT_NUMBER }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_acme_email: ${{ vars.ACME_EMAIL }}
          TF_VAR_echo_image: ${{ vars.ECHO_IMAGE }}
          TF_VAR_hello_image: ${{ vars.HELLO_IMAGE }}
          TF_VAR_hpa_image: ${{ vars.HPA_IMAGE }}
          TF_VAR_recovery_image: ${{ vars.RECOVERY_IMAGE }}
          TF_VAR_otel_collector_image: ${{ vars.OTEL_COLLECTOR_IMAGE }}
          TF_VAR_cert_manager_images: ${{ vars.CERT_MANAGER_IMAGES_JSON }}
          GO_BUILDER_IMAGE: ${{ vars.GO_BUILDER_IMAGE }}
          DOCKER_BUILDER_IMAGE: ${{ vars.DOCKER_BUILDER_IMAGE }}
          RUNTIME_IMAGE: ${{ vars.RUNTIME_IMAGE }}
          SYFT_IMAGE: ${{ vars.SYFT_IMAGE }}
          SMOKE_IMAGE: ${{ vars.SMOKE_IMAGE }}
          VERIFIER_IMAGE: ${{ vars.VERIFIER_IMAGE }}
          LOAD_IMAGE: ${{ vars.LOAD_IMAGE }}
        run: bash "scripts/gates/${{ inputs.operation }}-layer.sh" "${{ inputs.layer }}" "${{ inputs.profile }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-layer-${{ inputs.layer }}-${{ github.sha }}
          path: |
            test-results/live/
            !test-results/live/*.tfplan
          retention-days: 14
          if-no-files-found: error
