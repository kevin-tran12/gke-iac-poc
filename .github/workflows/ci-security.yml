name: CI security gates
on:
  workflow_call:
permissions:
  contents: read
jobs:
  security-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Install pinned security tools
        run: |
          bash scripts/install-security-tools.sh "$HOME/.local/bin"
          printf '%s\n' "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Run shared security gates
        run: PATH="$HOME/.local/bin:$PATH" bash scripts/ci/security-gates.sh
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: go
          build-mode: manual
      - name: Build Go modules for CodeQL
        run: |
          (cd app && go build ./...)
          (cd tests && go build ./...)
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: /language:go
