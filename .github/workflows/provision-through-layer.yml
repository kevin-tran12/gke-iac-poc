name: Operate one live layer
on:
  workflow_dispatch:
    inputs:
      layer:
        description: One layer to plan, apply, or verify
        required: true
        type: choice
        options: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
      profile:
        description: Root-specific profile
        required: true
        type: choice
        options: [core, data, recovery, ha, egress, full]
      operation:
        description: Run exactly one lifecycle operation
        required: true
        type: choice
        options: [plan, apply, verify]
permissions:
  contents: read
  id-token: write
concurrency:
  group: gke-lab-live
  cancel-in-progress: false
jobs:
  layer:
    uses: ./.github/workflows/integration-layer.yml
    with:
      layer: ${{ fromJSON(inputs.layer) }}
      profile: ${{ inputs.profile }}
      operation: ${{ inputs.operation }}
      approval_environment: ${{ inputs.operation == 'plan' && 'cloud-plan' || inputs.layer == '8' && 'public-edge' || inputs.profile != 'core' && 'paid-profile' || 'cloud-apply' }}
