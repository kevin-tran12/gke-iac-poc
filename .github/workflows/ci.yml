name: Required CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Dependency review only applies to pull requests
        if: github.event_name != 'pull_request'
        run: echo 'No dependency diff exists on a branch push.'
  security:
    uses: ./.github/workflows/ci-security.yml
  layer-00:
    uses: ./.github/workflows/ci-layer-00-tooling.yml
  layer-01:
    needs: [security, layer-00]
    uses: ./.github/workflows/ci-layer-01-bootstrap.yml
  layer-02:
    needs: [security, layer-00]
    uses: ./.github/workflows/ci-layer-02-network.yml
  layer-03:
    needs: [security, layer-00]
    uses: ./.github/workflows/ci-layer-03-platform.yml
  layer-04:
    needs: [security, layer-00]
    uses: ./.github/workflows/ci-layer-04-cluster.yml
  layer-05:
    needs: [security, layer-00]
    uses: ./.github/workflows/ci-layer-05-addons.yml
  layer-06:
    needs: [security, layer-00]
    uses: ./.github/workflows/ci-layer-06-workloads.yml
  layer-07:
    needs: [security, layer-00]
    uses: ./.github/workflows/ci-layer-07-delivery.yml
  layer-08:
    needs: [security, layer-00]
    uses: ./.github/workflows/ci-layer-08-edge.yml
  layer-09:
    needs: [security, layer-00]
    uses: ./.github/workflows/ci-layer-09-resilience.yml
  all-required:
    name: ci/all-required
    if: always()
    needs: [dependency-review, security, layer-00, layer-01, layer-02, layer-03, layer-04, layer-05, layer-06, layer-07, layer-08, layer-09]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every layer
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do test "$result" = success; done
