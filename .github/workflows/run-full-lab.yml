name: Run full gated lab
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  network:
    uses: ./.github/workflows/integration-layer.yml
    with: { layer: 2, profile: egress, approval_environment: public-edge }
    secrets: inherit
  platform:
    needs: network
    uses: ./.github/workflows/integration-layer.yml
    with: { layer: 3, profile: core, approval_environment: cloud-apply }
    secrets: inherit
  cluster:
    needs: platform
    uses: ./.github/workflows/integration-layer.yml
    with: { layer: 4, profile: recovery, approval_environment: paid-profile }
    secrets: inherit
  addons:
    needs: cluster
    uses: ./.github/workflows/integration-layer.yml
    with: { layer: 5, profile: core, approval_environment: cloud-apply }
    secrets: inherit
  workloads:
    needs: addons
    uses: ./.github/workflows/integration-layer.yml
    with: { layer: 6, profile: core, approval_environment: cloud-apply }
    secrets: inherit
  delivery:
    needs: workloads
    uses: ./.github/workflows/integration-layer.yml
    with: { layer: 7, profile: core, approval_environment: cloud-apply }
    secrets: inherit
  public-edge:
    needs: delivery
    uses: ./.github/workflows/integration-layer.yml
    with: { layer: 8, profile: core, approval_environment: public-edge }
    secrets: inherit
  resilience:
    needs: public-edge
    uses: ./.github/workflows/integration-layer.yml
    with: { layer: 9, profile: recovery, approval_environment: paid-profile }
    secrets: inherit
