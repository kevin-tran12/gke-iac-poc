  - id: GCP-0061
    paths:
      - terraform/cluster/main.tf
    statement: The GKE control plane has IP endpoints disabled and is reachable only through the authenticated DNS endpoint, so IP-based master authorized networks do not apply.
    expired_at: 2027-08-29
