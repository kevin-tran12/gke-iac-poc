apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-lab-worker
  labels:
    app.kubernetes.io/name: gke-lab-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gke-lab-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gke-lab-worker
    spec:
      serviceAccountName: gke-lab-worker
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: worker
          image: gke-lab-worker
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gke-lab-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
