apiVersion: batch/v1
kind: Job
metadata:
  name: gke-lab-smoke
  labels:
    app.kubernetes.io/name: gke-lab-smoke
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gke-lab-smoke
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: gke-lab-smoke
          args: ["--fail", "--show-error", "--retry", "20", "--retry-delay", "3", "http://gke-lab-api/healthz"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
